name: xenoci env probe4
on:
  push:
    branches: [xo-probe4]
jobs:
  probe:
    runs-on: xenoci-macos
    timeout-minutes: 8
    steps:
      - name: autologin
        shell: bash
        run: |
          U=$(id -un); UIDN=$(id -u)
          PW=$(LC_ALL=C tr -dc A-Za-z0-9 </dev/urandom | head -c 24)
          sudo -n dscl . -passwd "/Users/$U" "$PW"
          printf '%s' "$PW" | perl -e 'my @k=(0x7D,0x89,0x52,0x23,0xD2,0xBC,0xDD,0xEA,0xA3,0xB9,0x1F); local $/; my $p=<STDIN>; $p .= chr(0) x (12-(length($p)%12)); my $o=""; for my $i (0..length($p)-1) { $o .= chr(ord(substr($p,$i,1)) ^ $k[$i%11]); } binmode STDOUT; print $o;' | sudo -n tee /etc/kcpassword >/dev/null
          sudo -n chown root:wheel /etc/kcpassword; sudo -n chmod 600 /etc/kcpassword
          sudo -n defaults write /Library/Preferences/com.apple.loginwindow autoLoginUser "$U"
          echo "console before: $(stat -f%Su /dev/console) t=$(date +%s)"
          sudo -n /bin/launchctl kickstart -k system/com.apple.loginwindow </dev/null >/tmp/kick.out 2>&1 &
          echo "kicked"
      - name: wait-console
        shell: bash
        run: |
          perl -e 'for (1..90) { last if (stat("/dev/console"))[4] == $ARGV[0]; select(undef,undef,undef,1) } ' "$(id -u)"
          echo "console after: $(stat -f%Su /dev/console) t=$(date +%s)"; cat /tmp/kick.out || true
          launchctl print gui/$(id -u) 2>&1 | head -3
          ps -axo user,comm | grep -E "Finder|Dock|pboard|SetupAssistant|MiniBuddy" | grep -v grep || true
      - name: pasteboard
        shell: bash
        run: |
          JS='ObjC.import("AppKit"); var p=$.NSPasteboard.pasteboardWithUniqueName; (p && !p.isNil()) ? "PB_OK" : "PB_NULL"'
          echo "direct: $(osascript -l JavaScript -e "$JS" 2>&1)"
          echo "asuser: $(sudo -n launchctl asuser $(id -u) sudo -n -u $(id -un) osascript -l JavaScript -e "$JS" 2>&1)"
